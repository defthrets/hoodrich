; ===========================================================================
; THE STASH HOUSES -- places to rent across the south and the east side, every one of
; them another door onto the same stash as Denise's and Parkview. Read off the coordinate
; HUD by Michael on 2026-09-27, stood at each door facing it.
;
; The cheap ones open into the low-end apartment, the same room as E2, and the dear ones
; into the medium apartment -- the rooms every flat in GTA Online shares, both in the story
; map with nothing extra to load. Several doors onto one room is fine: the place you went
; in by is the place you come out of. See InteriorDoor.
;
; Address is the house number. The game's own name for the street the door is on goes
; after it -- "32 Something St" -- so it reads the way the sign does; Name is what the
; place answers to until the game has said.
;
; Every one of them can have a plug rung to it: stand within 20 metres of any of its doors
; and text one, and he pulls up outside, waits on the pavement, and walks the box to the
; front door, where it goes in the stash. Outside is the Drop, where there is one -- read
; stood where the car should stop, facing the way it should point -- and the side of the
; road nearest the front door where there is not.

