; =============================================================================
;  Hoodrich - drug dealing and gang mod for GTA V
;  Config lives here; gameplay data lives in scripts\Hoodrich\
;  Delete any line to fall back to the built-in default.
; =============================================================================

[General]
Enabled=true

; The way back in when Enabled is false.
;
; TURNING THE MOD OFF USED TO LOCK YOU OUT OF THE SWITCH. With it off the script
; stops reading buttons at all -- including the phone, which is the only route to
; the Settings screen holding the toggle -- so the only way back was editing this
; file. Flicking a switch to see what it does should not cost you a text editor.
;
; This key is read BEFORE that check. It only ever turns the mod back ON, because a
; key that toggles is a key that can leave you where you started. It also opens the
; phone normally when the mod is running, so it is one key that always does the
; obvious thing. None disables it.
RescueKey=F2

; Error | Warn | Info | Debug   -> scripts\Hoodrich.log
LogLevel=Info

; Seconds between autosaves. 0 disables autosave (still saves on unload).
SaveIntervalSeconds=120

; Freeze all Hoodrich gameplay while a story mission is running.
PauseDuringMission=true


[Phone]
; Hoodrich is a phone now. The PHONE button opens it -- apps on the home screen,
; arrows to move, Enter to open one, Backspace to go back and to put it away.
;
; The weapon wheel is the game's own again and is not touched in any way. The old
; radial menu hung off the weapon-wheel button, which meant a mod about dealing was
; charging you the one control you use most.

; An OPTIONAL extra key that also opens it. None to use the phone button alone.
;
; F2 by default, and the same key as General.RescueKey on purpose -- so one key
; opens the phone when the mod is running AND switches it back on when it is not.
Key=F2
; None | Shift | Control | Alt
Modifier=None

; Picking "Phone" on the home screen hands the button back to the game so you can
; open Franklin's own phone. There is no native that opens it, so you get a window
; to press the button in instead. Seconds.
VanillaPhoneSeconds=6

; Time scale while the phone is open. 1.0 = no slow motion.
TimeScale=0.25

BlurBackground=true
TimecycleModifier=hud_def_blur

PlaySounds=true


[Economy]
; Wholesale is the street base price minus this percent. Higher = cheaper stock.
BulkPurchaseDiscountPercent=50

; Grams you must sell before your crew's corner dealer will name his source and
; open the docks. 0 unlocks the docks immediately.
DocksUnlockGrams=50

; Street prices wander on their own. 0 minutes freezes the market.
MarketDriftIntervalMinutes=5
MarketMaxSwingPercent=45

; A block you keep working goes quiet. Every gram sold in a zone makes the next
; customer there a little slower to turn up, and it recovers while you are gone.
; This moves how OFTEN somebody walks up, never what they pay.
; false restores the old behaviour, where one good corner was the whole game.
BlockSaturationEnabled=true

; Grams sold in one zone that halve how often somebody walks up there. Lower
; makes the city a route; higher lets you post up all night in one spot.
BlockSaturationGrams=250

; Real minutes for a half-worked block to come all the way back. A completely
; dried-up one takes three times this, and that is as long as it ever gets.
BlockRecoveryMinutes=20

; How quiet the deadest block can get. There is always somebody, so never 0.
BlockDemandFloor=0.25


[Risk]
; Chance a completed sale turns out to have been undercover. Scaled by your
; notoriety, the turf you are on, and the product's own heat factor. Only rolled
; when nobody saw the handoff and the corner is still quiet -- a cop with line of
; sight, or a corner that has gone hot on its own, is already a star and does not
; also get a narc on top.
PoliceBustChancePercent=12

; The narc backs off and makes a call. This is your window to drop them, or to get
; UndercoverEscapeDistance metres from where the handoff happened. Let it run out
; and you get BustWantedStars, plus heat on the corner itself.
UndercoverCallSeconds=6
UndercoverEscapeDistance=40
BustWantedStars=2

; Percent of product dropped as a RECOVERABLE bag when you die.
LoseOnDeathPercent=100

; Percent the police keep when you are arrested. Not recoverable.
LoseOnArrestPercent=100

; Minutes a dropped bag survives before someone else takes it. 0 = forever.
DeadDropDespawnMinutes=10


[Supply]
; A plug rings you out of the blue with something he wants gone tonight -- his
; price drops while it stands, and only his. The offer arrives in Messages and
; the wheel shows what is left on the clock when you get to him.
ColdCallsEnabled=true

; How often the game even looks, and the chance it happens when it does.
ColdCallEveryMinutes=12
ColdCallChancePercent=35

; How long you have got to get there.
ColdCallMinutes=10

; Grams of each product a dealer holds when fully stocked.
DealerMaxStockGrams=120

; Minutes between restock steps; each tops a dealer up by a third of a load.
DealerRestockMinutes=10

; Chance a dealer simply has nothing when he posts up.
DealerDryChancePercent=20

[Hideouts]
; The stash house. There is one, it is Aunt Denise's, and you do not buy it.
; The house holds 300kg. Juan deals in bricks -- his smallest order is twelve kilos
; of weed -- so anything under about fifty thousand grams makes him unusable, and
; the whole point of him is that the corner stops being the interesting part.
; What you can CARRY is a separate and much smaller number; that is the constraint
; the dealing loop actually runs on.
HideoutStashCapacity=300000

; The house can be taken from you. Get loud enough, hold enough weight, and
; while you are out somebody comes for it -- police if it is heat that brought
; them, whoever you are beefing with if it is not.
; You are texted first, and being at the house when they arrive calls it off.
StashRaidsEnabled=true

; Chance per check that somebody comes, at full heat and a full house. Checked
; twice a minute, so 2 is about one raid per hour of loud, heavy dealing and
; none at all if you keep quiet or keep the house light. Under 250g in there,
; nobody is interested.
StashRaidChancePercent=2

; How much of the house goes when they get in.
StashRaidTakePercent=40

; Real minutes between the text and the door. This is your window to move it to
; the dead drop, carry it, or drive home and stand in the doorway.
StashRaidWarningMinutes=3

[PostUp]
; Posting up is the whole risk model. You pick a SPOT, not a customer, and the
; footfall there decides both how fast product moves and how hot the corner gets.
; A dead alley sells nothing and draws nothing. A busy pavement does both.

; Chance EACH passer-by decides to buy. Busy pavements compound this.
PostUpApproachChance=20

; Grams moved in one street sale.
PostUpDealGrams=1.5

; Extra heat per sale for every person who can see it happen.
PostUpHeatPerWitness=0.15

; Corner heat that brings a patrol over to ask what you are doing.
PostUpHeatBeforePolice=12

; Seconds from a cop reaching you to being searched. Walk away inside this and
; you are clear; stay and they take everything and fine you.
PostUpSearchSeconds=6

; The corner readout: the wordmark, the two bars, the verdict under them and the
; line of figures. Off hides all of it and changes nothing else -- sales, heat,
; patrols and reputation carry on exactly as they were, and the notifications stay,
; because with the panel gone they are the only thing that says a sale happened.
ShowDealHud=true
PostUpFine=2500

; Draw the blip art inside the posted-up HEAT and REPUTATION bars instead of their
; names. Set to false if the tags show up as literal text.
BlipsInBars=false

[Map]
; Grams a gang leader fronts you when he takes you on. A crew does not hand a
; stranger cash - it hands him work.
LeaderFrontGrams=20

[Socials]
; The feed occasionally says somewhere is busy tonight -- and it is: the block it
; names genuinely pays better until it wears off, so driving over because of
; something a stranger posted actually works. It never names the block you are
; already stood on.
BlockTipsEnabled=true
BlockTipEveryMinutes=15
BlockTipChancePercent=40

; How long the named block stays busy, and how much busier it gets.
BlockTipMinutes=12
BlockTipBoost=1.6

; Tweets are drawn down the RIGHT-hand side of the screen with the poster's own
; avatar, rather than going into the game's notification stack on the left.
;
; The native stack is anchored top-left and cannot be moved, so the feed used to
; share a column with busts, deliveries and warnings -- two unrelated kinds of
; message in one place, with the important one buried under chatter.
;
; Set this to false and every tweet goes back through the notification system
; exactly as it was. Everything else the mod says stays on the left either way.
TweetsOnTheRight=true

[Dealing]
; Where the bag sits on Franklin's back while he is dealing, and which way up.
; X is across his back, Y is front to back (negative is behind him), Z is up.
; Nudge and reload a save -- no rebuild needed.
BagX=0
BagY=-0.16
BagZ=0
BagPitch=0
BagRoll=0
BagYaw=0

[Cars]
; What Tanya charges to come out with the truck when one of Hao's cars is wrecked.
; She drives the whole way, hooks it and takes it back to the yard, and the car
; turns up on the lot afterwards. 0 makes the recovery free.
TowFee=500

; How long the yard keeps a recovered car, in IN-GAME hours. 36 is a day and a
; half, which is a bit over an hour of playing at the game's own clock. 0 puts it
; back the moment she drives off with it.
TowYardHours=36

; Where it is left when it comes back. All zeroes means each car goes to the space
; it was bought from, which is the safe default and what happens if you leave this
; alone.
;
; To use the forecourt outside the roller door instead: stand on the spot, read
; the coordinates off, and put them here. Nobody else's numbers will do -- a
; coordinate guessed from a map puts a car through a wall.
TowReturnX=0
TowReturnY=0
TowReturnZ=0
TowReturnH=0


; FRANKLIN'S OWN BIKE. The game gives him a Bagger and parks it outside his
; house; this swaps it, as it appears, for the bike named here -- same plate,
; same paint -- and puts him back on it if he was on it. Blank, or "bagger",
; leaves the game's own.
FranklinsBike=sanchez

; Which of that bike's liveries it wears, counting from 0 as the first.
FranklinsBikeLivery=0

[Scenery]
; Scenes arranged in Menyoo's Object Spooner, built every session instead of only
; in the session you placed them. scripts\Hoodrich\scenery\READ ME.txt says how.
Enabled=true

; Read menyooStuff\Spooner as well as the mod's own scenery folder.
FromMenyoo=true

; How near you have to be for a scene to be built, in metres.
Range=220


[Block]
; The set out driving its own blocks, which only happens while you are stood on
; them. Slow laps of Chamberlain Hills and Strawberry, a stop in a back alley now
; and again, two or four up, all of them dark green.
;
; The bikes ride in ones, twos and threes, one or two up, and pull off the road
; to stand about on the courts and the open ground rather than circling forever.
RollersEnabled=true

; Carloads out at once. Two is a neighbourhood; six is a convoy.
RollerCars=2

; Riders out at once. These are the bikes cutting between the yards -- and the
; ceiling for a crew as well as for a man on his own, so a pack of three counts
; as three. Set it to 1 and nobody rides in company.
RollerBikes=4

; The junction on Carson gets taken over once a night, some time between nine and
; four. Cars and people turn up, a ring forms facing the middle, and one or two
; cars work the inside of it sideways until the police come and everybody goes.
; Nothing is asked of you and there is no blip -- it happens whether you go or not.
TakeoverEnabled=true

; How many nights apart they are. 1 is every night, which is what it used to be and
; is why it stopped feeling like an event. 3 is one night in three.
TakeoverEveryNights=3

; How wide a circle the drifting cars drive, in metres. They aim at this and slide
; well outside it, which is the point -- it is what they are trying to hold, not a
; track they are on. 5 is the width of the tyre marks on that junction.
TakeoverSpinRadius=8

; How far out the ring of watchers stands, in metres. 19 is the distance measured
; between the middle of that intersection and the kerb.
TakeoverRadius=19

; Groups of the set walking the back streets on foot -- three or four together,
; a bottle between them, stopping to stand about, and talking loudly enough that
; you hear them before you see them. The rollers cover the roads; this is the
; pavements and the cut-throughs behind the buildings.
WalkersEnabled=true

; How many of those groups are out at once. Two is a neighbourhood.
WalkerCrews=2

; The pearl flake over the set's own colour, as an index into the game's paint
; table. The body colour is the set's and does not change; this is what is
; suspended in it, and a lighter green over the dark one is what makes a car
; shift as it turns under a street light.
;
; 53 is a brighter green. Set it to 49 -- the body colour itself -- to switch the
; effect off, and try the indices either side of 53 if it is not the green you
; wanted.
RollerPearl=53

; Whether riders pull the front wheel up. Only on a road, only at speed, and only
; now and again -- a bike stood on its back wheel permanently is a stunt show.
RollerWheelies=true

; How hard the front comes up. This is the one number here worth touching: it is
; a force against a mass the game owns, so the right value depends on the bike,
; and the gap between a wheel skimming the road and a rider on his back is about
; a decimal place. Lower is a lift, higher is a loop. 0 to 8.
RollerWheelieLift=1.9

; The cruise. Some time after ten every night, three cars come round the blocks
; in a line -- green with the neon on, hydraulics fitted, full of the set, radio
; up -- and one of them hits the switch now and again. The lowriders one night,
; the donks the next. Only built while you are on or near the turf to see them.
CruiseEnabled=true

[Jobs]
; Minutes Lamar wants to himself after a job before he has another one. He texts
; you when he is done scheming. 0 hands you the next one the moment he pays for
; the last.
LamarRestMinutes=10

[Tags]
; How the sprayed letters are drawn. Both want trying on a real wall rather than
; reasoning about -- change them, reload with the SHVDN key, spray one.
;
; DotSpacing is the gap between marks along a stroke, in letter heights. Smaller
; is more solid and costs more marks. Clamped to 0.05 - 0.40: a very small value
; is not a bad look, it is thousands of decals on one wall.
DotSpacing=0.11
; How wide each mark is, in metres. Wants to be comfortably bigger than the gap,
; because the splatter art is holes with paint around them rather than a disc.
DotSize=0.50

[Voice]
; Recorded dialogue over the conversation screen.
;
; Recordings live in scripts\Hoodrich\voice and are named after what is said:
; the speaker, then a hash of the line, e.g. gerald_1f3c9a20.mp3. Nothing has to
; be listed anywhere -- if the file is there it plays, and if it is not the
; screen is simply quiet. MP3 or WAV both work; MP3 is what you want, because
; the full script is about five hours of speech.
;
; Lines with a price, a name or a count in them are built as the screen draws
; them, so they hash differently every time and stay text-only. The set pieces
; are fixed text and those are the ones worth recording.
;
; Turn LogLevel up to Debug and every line that wanted audio and did not have it
; is written to Hoodrich.log already named, so playing through writes your own
; to-record list.
Enabled=true

; 0 to 1. This audio does NOT go through the game, so GTA's volume sliders do
; not touch it -- if you play with the game turned down, turn this down too.
Volume=0.9

; The police radio, as a fraction of the volume above. The call that goes out when
; an officer decides to come and look at you is a walkie-talkie in somebody else's
; hand thirty metres away, and it was coming out as loud as a man stood in front of
; you talking. Nought is silent, one is as loud as everything else.
PoliceRadioLoudness=0.4

; Whether a line you have already heard plays again.
;
; Off, because a recording is a performance rather than a sound effect. The
; first time he explains the business it is worth hearing; the fourth time you
; open that branch to check one sentence it is a speech being shouted at
; somebody who is skim-reading. The text is on screen either way -- only the
; performance is spent.
;
; What counts as heard is saved per game, so it survives a restart.
;
; ON IS FOR RECORDING. Replacing a take does not change the words, so it does
; not change the filename, so a save that already heard the old take will never
; play the new one. Turn this on while working and every line speaks every time.
RepeatLines=false

[Mask]
; WHERE THE FACE COVERING LIVES. Franklin's balaclava is component 8, drawable 4 --
; measured, not guessed. Component 1 is the mask slot on an Online character and the
; BEARD slot on a story one, which is why asking it for a mask returns a goatee; his
; holds five beards and nothing else. Component 8 is the undershirt slot, which is not
; where anybody would look and is exactly where Rockstar put it.
;
; Every slot's size goes to Hoodrich.log the first time the mask is used. To find a
; different one: Settings > Mask, put it on, and scroll while watching his head.
Slot=8

; Whether Slot means one of the eight PROP slots (hats, glasses, ears...) rather than
; a clothing component. False for the balaclava.
AsProp=false

; Which item in that slot.
Drawable=4

; And which colour of it.
Texture=0

[Highs]
; Whether the camera swings round the front while you take something. The animation
; is on his hands and his face and the gameplay camera is behind his head, so without
; this the work is invisible. It is taken for a few seconds and handed straight back,
; and it refuses outright in a car, in the air, in a cutscene or in a fight.
DrugCamera=true

; How long the taking itself lasts, as a multiple of what each one is written to
; take. A bump is short and a joint is not, and this scales them together without
; flattening that out. The camera and the animation both follow it.
AnimLength=1.0

[Knowai]
; Whether the app shows you the place while you are choosing it -- a slow circle of the
; destination, live, behind the picker. He is held where he stands until it hands back.
; Off, the picker sits over the street you are on.
Preview=true

[HandFit]
; Where each held thing sits in his hand, six numbers a line: forward, right, up in
; centimetres, then pitch, roll, yaw in degrees. Set from Settings -> In his hand, which
; puts the thing in his hand with the pose it is used in and writes the numbers here as
; you go. Nothing listed means the prop sits where the game puts it.
; p_amb_joint_01=0,0,0,0,0,0

; ============================================================================
; DOORS
;
; Anywhere with an inside can have a door: a club, the casino, a shop. Each one
; is a section of its own, with its name listed here, comma separated.
;
; The settings screen writes both ends for you rather than you typing numbers.
; Under "Doors": stand at the entrance and press "A door goes here", then stand
; inside and press "...and the inside is here". Press Insert and it is there.
;
; Every coordinate in this mod that was typed rather than measured has been
; wrong at least once. That is what those two rows exist to stop.
;
; A finished one looks like this. Ipl is only needed for a room that is not
; already in the map:
;
;   [Doors]
;   More=Casino
;
;   [Casino]
;   Name=casino
;   Blip=true
;   DoorX=935.0
;   DoorY=46.0
;   DoorZ=81.0
;   DoorHeading=60.0
;   InsideX=1089.0
;   InsideY=206.0
;   InsideZ=-49.0
;   InsideHeading=180.0
;
; The two rooms the mod comes with -- the grow room behind Lamar's and the pill
; press garage -- are built in and need no section. To move either, add a section
; named [GrowRoom] or [CrackDen] with the keys above; any key you leave out keeps
; its built-in value.
[Doors]
More=
