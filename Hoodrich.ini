; =============================================================================
;  Posted Up -- settings
;
;  Everything here is on the settings screen in the game too: Settings on the
;  phone's wheel. Change it there, or here with the game closed. Delete a line
;  and it goes back to the default.
; =============================================================================

[General]
; What the menus, prompts and notices are in. English fills in anything a
; language does not cover.
;   English, EnglishUS, PortugueseBR, Spanish, French, German, Russian, Polish,
;   ChineseSimplified (needs the game itself in Chinese), Hindi (Latin letters)
Language=English

; false switches Posted Up off without uninstalling it. RescueKey turns it back
; on again -- Divide is the / on the number pad. None for no key.
Enabled=true
RescueKey=Divide

; Hold everything while a Rockstar story mission is running.
PauseDuringMission=true

; How much goes in scripts\Hoodrich\Hoodrich.log: Error, Warn, Info or Debug.
; If something goes wrong, set Debug, play until it happens, and send the log.
LogLevel=Info


[Phone]
; Up on the D-pad or the up arrow opens Posted Up's phone. false gives that
; button back to the game's own phone; the key below still opens ours.
PhoneButton=true

; A key of your own that opens it as well, and a key held with it. None for none.
Key=F2
Modifier=None

PlaySounds=true
BlurBackground=true

; How slow time goes while the phone is up. 1.0 turns the slowdown off.
TimeScale=0.25


[LUber]
; The camera looks at where you are going while you choose it.
Preview=true


[Voice]
; Gerald, Lamar, Hao and Tao in their own voices. false leaves the words on screen.
Enabled=true
Volume=0.9


[Socials]
; Where the feed goes. FeedOnScreen=false is nowhere. Otherwise TweetsOnTheRight
; is the card down the right of the screen, FeedOnPhone is only in the phone, and
; both false is the game's own notifications.
FeedOnScreen=true
TweetsOnTheRight=true
FeedOnPhone=false

; Turns the feed on and off wherever you are.
FeedKey=F4

; Somebody posts that a block is busy -- and it genuinely is.
BlockTipsEnabled=true


[Block]
; The set out driving and riding while you are on our turf, and riders pulling
; wheelies when they have the room.
RollersEnabled=true
RollerWheelies=true

; The lowriders one night and the donks the next, three in a line after ten.
CruiseEnabled=true

; Crews of ours walking the back streets.
WalkersEnabled=true

; The takeover at the junction on Carson: once a night in this many.
TakeoverEnabled=true
TakeoverEveryNights=3

; CRASH PROTECTION. Ours hold off when the world already has more people or cars
; than this. Lower both if your game goes down on a busy block.
PedsBusy=190
CarsBusy=230


[Scenery]
; The people round the neighbourhood change what they are doing, stretch their
; legs, walk off and come back.
PedsLive=true


[PostUp]
; The wordmark and the bars while you are posted up. The corner works either way.
ShowDealHud=true

; Map art at the ends of the reputation and heat bars.
BlipsInBars=false


[Supply]
; Buyers ring you wanting something, somewhere, for a while.
ColdCallsEnabled=true


[Economy]
; Selling on one corner makes the next customer there slower to turn up.
BlockSaturationEnabled=true


[Risk]
; How much of what you are carrying you lose when you die, and when you are
; nicked. 0 to 100.
LoseOnDeathPercent=100
LoseOnArrestPercent=100


[Hideouts]
; Hold enough and get loud enough, and somebody comes for the house while you
; are out.
StashRaidsEnabled=true


[Highs]
; The camera swings round the front while you take something.
DrugCamera=true

; How long taking something takes. 1.0 is as it was recorded.
AnimLength=1.0


[Hoops]
; A ring on each hoop on the Chamberlain Hills court where the ball has to go
; through, to practise with.
ShowRings=false


[GamblingDen]
; The tables: the smallest chip, and the most any one bet may be.
MinBet=100
MaxBet=10000

; One spin of a slot machine ("bet one"). Bet max on the machine is five of them.
SlotBet=10
