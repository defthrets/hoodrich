; Parkview -- the scene on the open ground in Chamberlain Hills, and the loader that
; builds it. Every value here has a default in the mod, so a missing line is fine.

[General]
Enabled=true

; Error, Warn, Info or Debug. Debug writes a lot; useful when something is wrong.
LogLevel=Info

[Scenery]
; Build the scene files in scripts\Parkview\scenery at all.
Enabled=true

; Read menyooStuff\Spooner as well. For MAKING scenes: save one in Menyoo's Object
; Spooner and it stands up here without a copy step. Off unless you are doing that --
; a spooner folder full of downloaded maps would otherwise be built as scenery.
FromMenyoo=false

; How near you have to be for a scene to be built, in metres.
Range=220

; The people live a little: they change what they are doing, stretch their legs,
; walk off for a while and come back on foot, talk, and in the small hours they are
; not there at all. Off leaves everybody stood on their mark all night.
PedsLive=true

; A name over everybody near you, all the time. Off, because NPC Mind puts the name
; up over the one person you are looking at, with "press E to talk" -- which is when
; you want it. On is for an install without NPC Mind.
Names=false

; The hours, on the game's clock, that nobody is stood about a scene. The same
; number in both means never.
QuietFrom=3
QuietTo=7

[Rooms]
; The doors on the block can be rented. Walk up to one and it offers itself;
; once it is yours, walk up again and you can go in. The doors themselves are
; in scripts\Parkview\rooms.txt, and what you have rented is kept in rooms.sav
; next to the log.
Enabled=true

; What a room costs for a week on the game's clock. Taken up front and again
; every seventh day; short of it, the room goes.
RentPerWeek=250

[Keys]
; Save everything placed within 80 m of you to a scene file (F9).
Capture=F9
CaptureModifier=None

; Take down what is standing and build it from the files again (Shift+F9).
Reload=F9
ReloadModifier=Shift

; Hide the map prop you are looking at, for good (Ctrl+F9).
Hide=F9
HideModifier=Control

; Set the room every door opens into, to wherever you are standing (Alt+F9).
; Stand in the interior you want first -- the log says whether the game agrees
; you are inside one. F10 is Five0 Patrol's, so this stays in Parkview's own
; F9 family.
SetRoom=F9
SetRoomModifier=Alt

; Take over the map prop you are looking at (Numpad *): the vanilla one is
; hidden for good and a copy of it is put in its place, yours to move. Do it
; BEFORE you move the thing -- see scripts\Parkview\scenery\READ ME.txt.
Take=Multiply
TakeModifier=None
